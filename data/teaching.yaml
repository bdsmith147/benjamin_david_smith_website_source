      name: "Principles of Physics 1"
      term: "Spring 2016"
      rating: "6.3/7.0"
      description: "The first course in the calculus-based sequence of introductory physics for science majors, focused on Newtonian laws of motion and the concept of energy, taught with peer-instruction active learning."
