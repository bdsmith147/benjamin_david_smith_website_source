      name: "Beginning Physics Lab"
      term: "Winter & Spring 2016"
      rating: "6.1/7.0"
      description: "A hands-on laboratory course introducing first-year students to experimental physics, with emphasis on experimental uncertainty, statistical analysis, regressions, and simple numerical modelling."

