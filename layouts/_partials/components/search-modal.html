{{- /* Site search modal. Uses Pagefind (built in CI) when present, otherwise the site's
       index.json, otherwise a Google site: search. Opens with the navbar icon or Ctrl/Cmd-K. */ -}}
{{- $site := urls.Parse site.BaseURL }}
<div class="search-modal" id="search-modal" role="dialog" aria-modal="true" aria-labelledby="search-title" hidden>
  <div class="search-backdrop" data-search-close></div>
  <div class="search-panel">
    <h2 id="search-title" class="sr-only">{{ i18n "label_search" }}</h2>
    <div class="search-input-row">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg>
      <label for="search-input" class="sr-only">{{ i18n "label_search" }}</label>
      <input id="search-input" type="search" autocomplete="off" spellcheck="false" placeholder="{{ i18n "label_search_placeholder" }}" aria-controls="search-results">
      <button type="button" class="search-close" data-search-close aria-label="{{ i18n "label_close" }}">Esc</button>
    </div>
    <ul id="search-results" class="search-results" role="listbox" aria-label="{{ i18n "label_search" }}"></ul>
    <p class="search-fallback"><a id="search-google" href="https://www.google.com/search?q=site%3A{{ printf "%s%s" $site.Host $site.Path | urlquery }}">{{ i18n "label_search_google" }}</a></p>
  </div>
</div>
<script>
(function () {
  var modal = document.getElementById('search-modal');
  var input = document.getElementById('search-input');
  var list = document.getElementById('search-results');
  var google = document.getElementById('search-google');
  var siteQuery = {{ printf "%s%s" $site.Host $site.Path }};
  var pagefindURL = {{ "pagefind/pagefind.js" | relURL }};
  var indexURL = {{ "index.json" | relURL }};
  var noResults = {{ i18n "label_no_results" }};
  var engine = null, lastFocus = null, active = -1, timer = null;

  function loadEngine() {
    if (engine) return engine;
    engine = import(pagefindURL).then(function (pf) {
      if (pf.init) pf.init();
      return function (q) {
        return pf.search(q).then(function (r) {
          return Promise.all(r.results.slice(0, 12).map(function (x) { return x.data(); }));
        }).then(function (items) {
          return items.map(function (d) { return { title: d.meta.title, url: d.url, text: d.excerpt, html: true }; });
        });
      };
    }).catch(function () {
      return fetch(indexURL).then(function (r) { return r.json(); }).then(function (docs) {
        return function (q) {
          var terms = q.toLowerCase().split(/\s+/).filter(Boolean);
          var scored = docs.map(function (d) {
            var t = (d.title || '').toLowerCase(), b = (d.text || '').toLowerCase(), s = 0;
            for (var i = 0; i < terms.length; i++) {
              if (t.indexOf(terms[i]) > -1) s += 3; else if (b.indexOf(terms[i]) > -1) s += 1; else return null;
            }
            return { doc: d, score: s };
          }).filter(Boolean).sort(function (a, b) { return b.score - a.score; });
          return Promise.resolve(scored.slice(0, 12).map(function (x) {
            return { title: x.doc.title, url: x.doc.url, text: x.doc.kind + (x.doc.meta ? ' · ' + x.doc.meta : '') };
          }));
        };
      });
    });
    return engine;
  }

  function render(results) {
    list.innerHTML = '';
    active = -1;
    if (!results.length) { var li = document.createElement('li'); li.className = 'search-empty'; li.textContent = noResults; list.appendChild(li); return; }
    results.forEach(function (r, i) {
      var li = document.createElement('li');
      li.setAttribute('role', 'option');
      li.id = 'sr-' + i;
      var a = document.createElement('a');
      a.href = r.url;
      var t = document.createElement('span'); t.className = 'sr-title'; t.textContent = r.title;
      var x = document.createElement('span'); x.className = 'sr-text';
      if (r.html) { x.innerHTML = r.text; } else { x.textContent = r.text || ''; }
      a.appendChild(t); a.appendChild(x); li.appendChild(a); list.appendChild(li);
    });
  }

  function run() {
    var q = input.value.trim();
    google.href = 'https://www.google.com/search?q=' + encodeURIComponent('site:' + siteQuery + (q ? ' ' + q : ''));
    if (!q) { list.innerHTML = ''; return; }
    loadEngine().then(function (search) { return search(q); }).then(render).catch(function () { render([]); });
  }

  function open(prefill) {
    lastFocus = document.activeElement;
    modal.hidden = false;
    document.body.classList.add('search-open');
    if (typeof prefill === 'string') input.value = prefill;
    input.focus();
    loadEngine();
    if (input.value) run();
  }
  function close() {
    modal.hidden = true;
    document.body.classList.remove('search-open');
    if (lastFocus) lastFocus.focus();
  }
  function move(d) {
    var items = list.querySelectorAll('li[role=option]');
    if (!items.length) return;
    if (active > -1) items[active].classList.remove('active');
    active = (active + d + items.length) % items.length;
    items[active].classList.add('active');
    input.setAttribute('aria-activedescendant', items[active].id);
    items[active].scrollIntoView({ block: 'nearest' });
  }

  document.querySelectorAll('[data-search-open]').forEach(function (b) { b.addEventListener('click', function () { open(); }); });
  modal.querySelectorAll('[data-search-close]').forEach(function (b) { b.addEventListener('click', close); });
  input.addEventListener('input', function () { clearTimeout(timer); timer = setTimeout(run, 120); });
  input.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowDown') { e.preventDefault(); move(1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); move(-1); }
    else if (e.key === 'Enter') {
      var items = list.querySelectorAll('li[role=option] a');
      var target = items[active > -1 ? active : 0];
      if (target) { e.preventDefault(); window.location.href = target.href; }
    }
  });
  document.addEventListener('keydown', function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); modal.hidden ? open() : close(); }
    else if (e.key === 'Escape' && !modal.hidden) { close(); }
  });
  window.openSiteSearch = open;
})();
</script>
