{{ define "main" }}
{{- $d := .Params.document }}
<article class="page-wrap document-page">
  {{ partial "breadcrumbs.html" . }}
  <header class="list-header"><h1>{{ .Title }}</h1></header>
  <div class="prose">{{ .Content }}</div>
  {{- with $d }}
  <section class="document-embed" aria-labelledby="doc-title">
    <h2 id="doc-title">{{ .title }}</h2>
    <p class="muted">{{ site.Params.owner.name }} · {{ .date }}</p>
    <p><a class="btn btn-solid" href="{{ .pdf | relURL }}" download>Download essay (PDF)</a></p>
    <object class="pdf-embed" data="{{ .pdf | relURL }}" type="application/pdf" width="100%" height="900" aria-label="{{ .title }} (PDF)">
      <p><a href="{{ .pdf | relURL }}">{{ .title }} (PDF)</a></p>
    </object>
  </section>
  {{- end }}
</article>
{{ end }}
